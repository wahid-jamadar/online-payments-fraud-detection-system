{% extends 'base.html' %}

{% block content %}

<h1 class="page-title">Fraud Detection Engine</h1>

<form method="POST" action="/predict_result" class="predict-form">

<input name="step" type="number" placeholder="Step" required>

<select name="type" required>
<option value="">Select Type</option>
<option value="PAYMENT">PAYMENT</option>
<option value="TRANSFER">TRANSFER</option>
<option value="CASH_OUT">CASH_OUT</option>
<option value="DEBIT">DEBIT</option>
<option value="CASH_IN">CASH_IN</option>
</select>

<input name="amount" type="number" step="0.01" placeholder="Amount" required>
<input name="oldbalanceOrg" type="number" step="0.01" placeholder="Old Balance Org" required>
<input name="newbalanceOrig" type="number" step="0.01" placeholder="New Balance Orig" required>
<input name="oldbalanceDest" type="number" step="0.01" placeholder="Old Balance Dest" required>
<input name="newbalanceDest" type="number" step="0.01" placeholder="New Balance Dest" required>

<button type="submit">Analyze Transaction</button>

</form>

{% endblock %}
